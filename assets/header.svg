<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Evan Lowry</title>
  <desc id="desc">A minimal black macOS-style window: ~/evan-lowry with name, bio, and links.</desc>

  <!-- window -->
  <rect x="4" y="4" width="1192" height="272" rx="14" fill="#0a0a0a" stroke="#2e2e2e" stroke-width="2"/>
  <line x1="4" y1="50" x2="1196" y2="50" stroke="#2e2e2e" stroke-width="2"/>
  <circle cx="28" cy="25" r="6.5" fill="#ff5f57"/>
  <circle cx="48" cy="25" r="6.5" fill="#febc2e"/>
  <circle cx="68" cy="25" r="6.5" fill="#28c840"/>
  <text x="600" y="31" text-anchor="middle" fill="#a1a1aa" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">~/evan-lowry</text>

  <!-- body -->
  <text x="40" y="120" fill="#ffffff" font-size="44" font-weight="700" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">Evan Lowry</text>
  <rect x="304" y="90" width="18" height="32" fill="#58a6ff"/>
  <text x="40" y="158" fill="#d4d4d8" font-size="19" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">I study computational math at Waterloo. Mostly I just like</text>
  <text x="40" y="186" fill="#d4d4d8" font-size="19" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">pulling things apart and rebuilding them to see how they work.</text>

  <!-- buttons -->
  <rect x="40" y="204" width="150" height="44" rx="8" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <text x="115" y="232" text-anchor="middle" fill="#58a6ff" font-size="19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">View work</text>
  <rect x="202" y="204" width="118" height="44" rx="8" fill="none" stroke="#2e2e2e" stroke-width="2"/>
  <text x="261" y="232" text-anchor="middle" fill="#ffffff" font-size="19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">GitHub</text>
  <rect x="332" y="204" width="102" height="44" rx="8" fill="none" stroke="#2e2e2e" stroke-width="2"/>
  <text x="383" y="232" text-anchor="middle" fill="#ffffff" font-size="19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Email</text>
</svg>
