<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Evan Lowry - mathematics, software, and open source</title>
  <desc id="desc">A dark code-themed banner with a wireframe cube, mathematical symbols, and a terminal-style introduction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#102a43"/>
      <stop offset="1" stop-color="#123b4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62d8ff"/>
      <stop offset="1" stop-color="#7fffb2"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#9bdcff" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <circle cx="1080" cy="45" r="170" fill="#52f2c2" opacity="0.05"/>
  <circle cx="105" cy="270" r="190" fill="#4ea8ff" opacity="0.06"/>

  <g transform="translate(70 54)" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round" filter="url(#glow)">
    <path d="M90 0l78 45v90l-78 45-78-45V45z"/>
    <path d="M12 45l78 45 78-45M90 90v90"/>
    <path d="M51 68l78-45M51 112l78 45" opacity="0.45"/>
  </g>
  <g fill="#8fdfff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" opacity="0.65">
    <text x="50" y="42" font-size="16">f(x) = build(x) + learn(x)</text>
    <text x="236" y="258" font-size="17">O(log n)</text>
    <text x="1030" y="262" font-size="17">Σ ideas → software</text>
  </g>

  <g transform="translate(330 58)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="790" height="184" rx="15" fill="#06101d" fill-opacity="0.82" stroke="#8bdfff" stroke-opacity="0.28"/>
    <circle cx="24" cy="23" r="6" fill="#ff6b6b"/>
    <circle cx="44" cy="23" r="6" fill="#ffd166"/>
    <circle cx="64" cy="23" r="6" fill="#65e6a7"/>
    <text x="28" y="72" fill="#7fffb2" font-size="20">evan@waterloo:~$</text>
    <text x="250" y="72" fill="#e7f7ff" font-size="20">whoami</text>
    <text x="28" y="112" fill="#ffffff" font-size="34" font-weight="700">Evan Lowry</text>
    <text x="28" y="148" fill="#b8d8e8" font-size="18">Math · Software · Open Source</text>
    <rect x="28" y="164" width="12" height="3" fill="#7fffb2"/>
  </g>

  <g fill="#7fffb2">
    <circle cx="278" cy="62" r="4"/><circle cx="294" cy="82" r="3"/><circle cx="266" cy="100" r="2.5"/>
    <path d="M278 62l16 20-28 18" fill="none" stroke="#7fffb2" stroke-opacity="0.5"/>
  </g>
</svg>
