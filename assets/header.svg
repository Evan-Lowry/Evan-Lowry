<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Evan Lowry</title>
  <desc id="desc">A black macOS-style terminal window: ~/evan-lowry with name, bio, and links.</desc>
  <defs>
    <pattern id="grid-sm" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4d565f" stroke-opacity="0.32" stroke-width="1"/>
    </pattern>
    <pattern id="grid-lg" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#4d565f" stroke-opacity="0.55" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="#000000"/>
  <rect width="1280" height="640" fill="url(#grid-sm)"/>
  <rect width="1280" height="640" fill="url(#grid-lg)"/>

  <!-- window -->
  <rect x="90" y="80" width="1100" height="480" rx="16" fill="#0a0a0a" stroke="#2e2e2e" stroke-width="2"/>
  <line x1="90" y1="140" x2="1190" y2="140" stroke="#2e2e2e" stroke-width="2"/>
  <circle cx="130" cy="110" r="8" fill="#ff5f57"/>
  <circle cx="157" cy="110" r="8" fill="#febc2e"/>
  <circle cx="184" cy="110" r="8" fill="#28c840"/>
  <text x="640" y="118" text-anchor="middle" fill="#a1a1aa" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">~/evan-lowry</text>

  <!-- body -->
  <text x="138" y="208" fill="#a1a1aa" font-size="20" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">COMPUTATIONAL MATHEMATICS · UNIVERSITY OF WATERLOO</text>
  <text x="136" y="304" fill="#ffffff" font-size="84" font-weight="700" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">Evan Lowry</text>
  <rect x="618" y="244" width="34" height="58" fill="#58a6ff"/>
  <text x="138" y="366" fill="#d4d4d8" font-size="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">I study computational math at Waterloo. Mostly I just like</text>
  <text x="138" y="404" fill="#d4d4d8" font-size="26" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">pulling things apart and rebuilding them to see how they work.</text>

  <!-- buttons -->
  <rect x="138" y="444" width="172" height="54" rx="9" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <text x="224" y="479" text-anchor="middle" fill="#58a6ff" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">View work</text>
  <rect x="326" y="444" width="138" height="54" rx="9" fill="none" stroke="#2e2e2e" stroke-width="2"/>
  <text x="395" y="479" text-anchor="middle" fill="#ffffff" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">GitHub</text>
  <rect x="480" y="444" width="118" height="54" rx="9" fill="none" stroke="#2e2e2e" stroke-width="2"/>
  <text x="539" y="479" text-anchor="middle" fill="#ffffff" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Email</text>
</svg>
